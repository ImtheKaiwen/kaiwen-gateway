name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (verification and build only; default true)"
        required: false
        type: boolean
        default: true
      recovery_release_tag:
        description: "EMERGENCY RECOVERY ONLY: Exact published release tag to recover publication for (must be 'v0.1.0a1')"
        required: false
        type: string
        default: ""
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify & Build Release Distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      package_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify and checkout release tag for emergency recovery
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_release_tag != ''
        run: |
          if [ "${{ inputs.recovery_release_tag }}" != "v0.1.0a1" ]; then
            echo "ERROR: Emergency recovery is restricted strictly to tag 'v0.1.0a1'."
            exit 1
          fi
          echo "Fetching tags..."
          git fetch --tags origin
          ACTUAL_TAG_COMMIT="$(git rev-parse v0.1.0a1^{commit})"
          EXPECTED_TAG_COMMIT="7d7cf9754cae512233229d9da77ec7a61d6ca35a"
          echo "Checking v0.1.0a1 commit: ${ACTUAL_TAG_COMMIT} (expected: ${EXPECTED_TAG_COMMIT})"
          if [ "${ACTUAL_TAG_COMMIT}" != "${EXPECTED_TAG_COMMIT}" ]; then
            echo "ERROR: Tag v0.1.0a1 does not point to expected commit ${EXPECTED_TAG_COMMIT}"
            exit 1
          fi
          echo "Checking out immutable release tag v0.1.0a1..."
          git checkout v0.1.0a1

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.33"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Extract package version from pyproject.toml
        id: version
        run: |
          VERSION="$(uv run --no-project --python 3.12 python -c '
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          ')"
          echo "Package version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag against package version
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.recovery_release_tag != '')
        run: |
          EXPECTED_TAG="v${{ steps.version.outputs.version }}"
          if [ "${{ github.event_name }}" = "release" ]; then
            ACTUAL_TAG="${{ github.ref_name }}"
          else
            ACTUAL_TAG="${{ inputs.recovery_release_tag }}"
          fi
          echo "Checking release tag '${ACTUAL_TAG}' against expected '${EXPECTED_TAG}'..."
          if [ "${ACTUAL_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "ERROR: Release tag '${ACTUAL_TAG}' does not match package version '${EXPECTED_TAG}'"
            exit 1
          fi
          echo "Release tag matches package version exactly."

      - name: Verify lockfile
        run: uv lock --check

      - name: Audit locked dependencies for known vulnerabilities
        run: uv audit --locked --preview-features audit-command

      - name: Build wheel and sdist distributions
        run: uv build

      - name: Inspect distributions
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          dist_dir = pathlib.Path("dist")
          wheels = list(dist_dir.glob("*.whl"))
          sdists = list(dist_dir.glob("*.tar.gz"))
          assert len(wheels) == 1, f"Expected 1 wheel, found {wheels}"
          assert len(sdists) == 1, f"Expected 1 sdist, found {sdists}"

          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
              assert "kaiwen_gateway/__init__.py" in names
              assert "kaiwen_gateway/py.typed" in names
              assert "kaiwen_gateway/core/__init__.py" in names
              assert "kaiwen_gateway/server/__init__.py" in names
              assert "kaiwen_gateway/modules/voice/__init__.py" in names
              assert "kaiwen_gateway/transports/synthetic/__init__.py" in names
              assert not any(n.startswith("tests/") for n in names), "tests/ leaked into wheel"
              meta = [n for n in names if n.endswith(".dist-info/METADATA")][0]
              meta_text = zf.read(meta).decode("utf-8")
              assert "Version: 0.1.0a1" in meta_text
              assert "Provides-Extra: server" in meta_text

          with tarfile.open(sdists[0], "r:gz") as tf:
              s_names = tf.getnames()
              assert any(n.endswith("/src/kaiwen_gateway/__init__.py") for n in s_names)
              assert any(n.endswith("/pyproject.toml") for n in s_names)

          print("Distribution inspection passed successfully.")
          PY

      - name: Test clean virtualenv (core package only)
        run: |
          WHEEL_PATH="$(pwd)/dist/kaiwen_gateway-${{ steps.version.outputs.version }}-py3-none-any.whl"
          SMOKE_DIR="$(mktemp -d)"
          cd "${SMOKE_DIR}"
          uv venv --python 3.12 .venv_core
          uv pip install --python .venv_core/bin/python "${WHEEL_PATH}"
          .venv_core/bin/python -c "
          import kaiwen_gateway
          assert kaiwen_gateway.__version__ == '${{ steps.version.outputs.version }}'
          from kaiwen_gateway.core.identity import VerifiedConnectionContext
          for pkg in ['starlette', 'uvicorn', 'websockets']:
              try:
                  __import__(pkg)
                  raise AssertionError(f'Unexpected package {pkg} in core-only install')
              except ImportError:
                  pass
          print('Core-only clean virtualenv import verified.')
          "
          .venv_core/bin/kaiwen-gateway --version
          .venv_core/bin/kaiwen-gateway check-config

      - name: Test clean virtualenv ([server] extra) and execute CLI smoke tests
        run: |
          WHEEL_PATH="$(pwd)/dist/kaiwen_gateway-${{ steps.version.outputs.version }}-py3-none-any.whl"
          SMOKE_DIR="$(mktemp -d)"
          cd "${SMOKE_DIR}"
          uv venv --python 3.12 .venv_server
          uv pip install --python .venv_server/bin/python "${WHEEL_PATH}[server]"
          .venv_server/bin/kaiwen-gateway --version
          .venv_server/bin/kaiwen-gateway check-config

          echo "Running standard control plane demo..."
          DEMO_OUT="$(.venv_server/bin/kaiwen-gateway demo --timeout 10.0)"
          echo "${DEMO_OUT}"
          case "${DEMO_OUT}" in
            *"Result: PASS"*) echo "Control plane demo passed" ;;
            *) echo "Control plane demo failed: ${DEMO_OUT}"; exit 1 ;;
          esac
          case "${DEMO_OUT}" in
            *"0 active connections, 0 active calls, 0 active admission leases"*) echo "Zero leak verified in control demo" ;;
            *) echo "Control demo missing zero-leak confirmation: ${DEMO_OUT}"; exit 1 ;;
          esac

          echo "Running synthetic media audio streaming and interruption demo..."
          DEMO_MEDIA_OUT="$(.venv_server/bin/kaiwen-gateway demo --media --timeout 15.0)"
          echo "${DEMO_MEDIA_OUT}"
          case "${DEMO_MEDIA_OUT}" in
            *"Result: PASS"*) echo "Synthetic media demo passed" ;;
            *) echo "Synthetic media demo failed: ${DEMO_MEDIA_OUT}"; exit 1 ;;
          esac
          case "${DEMO_MEDIA_OUT}" in
            *"0 active connections, 0 active calls, 0 active admission leases"*) echo "Zero leak verified in media demo" ;;
            *) echo "Media demo missing zero-leak confirmation: ${DEMO_MEDIA_OUT}"; exit 1 ;;
          esac

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing OIDC)
    needs: [verify-and-build]
    # Fail-closed guard: PyPI publishing is strictly restricted to:
    # 1. An authorized, published, non-draft GitHub Release event where vars.PYPI_PUBLISH_AUTHORIZED == 'true'
    # 2. Or an explicit emergency recovery workflow dispatch for release tag 'v0.1.0a1'
    #    with dry_run == false and vars.PYPI_PUBLISH_AUTHORIZED == 'true'.
    # Ordinary workflow_dispatch runs (with dry_run == true or missing recovery_release_tag) NEVER publish.
    if: |
      (github.event_name == 'release' && github.event.action == 'published' && !github.event.release.draft && vars.PYPI_PUBLISH_AUTHORIZED == 'true') ||
      (github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.recovery_release_tag == 'v0.1.0a1' && vars.PYPI_PUBLISH_AUTHORIZED == 'true')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for Trusted Publishing OIDC
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/kaiwen-gateway
    steps:
      - name: Verify maintainer publishing authorization and recovery constraints
        run: |
          echo "Verifying publishing safety guards..."
          if [ "${{ vars.PYPI_PUBLISH_AUTHORIZED }}" != "true" ]; then
            echo "ERROR: Unintentional PyPI publish prevented. Repository variable PYPI_PUBLISH_AUTHORIZED must be 'true'."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "release" ]; then
            if [ "${{ github.event.action }}" != "published" ] || [ "${{ github.event.release.draft }}" = "true" ]; then
              echo "ERROR: Release publishing requires a published, non-draft release."
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "ERROR: Dry-run workflow dispatch cannot publish to PyPI."
              exit 1
            fi
            if [ "${{ inputs.recovery_release_tag }}" != "v0.1.0a1" ]; then
              echo "ERROR: Emergency recovery publishing is strictly restricted to tag 'v0.1.0a1'."
              exit 1
            fi
          else
            echo "ERROR: Unsupported publishing event '${{ github.event_name }}'."
            exit 1
          fi
          echo "Publishing authorization confirmed."

      - name: Download build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-dists
          path: dist/

      - name: Validate distribution files and checksums before PyPI upload
        run: |
          cd dist
          echo "Verifying distribution contents..."
          ls -la
          if [ ! -f "SHA256SUMS" ]; then
            echo "ERROR: Missing SHA256SUMS file in release artifacts"
            exit 1
          fi
          sha256sum -c SHA256SUMS
          if [ ! -f "kaiwen_gateway-0.1.0a1-py3-none-any.whl" ] || [ ! -f "kaiwen_gateway-0.1.0a1.tar.gz" ]; then
            echo "ERROR: Expected release distributions not found in dist/"
            exit 1
          fi
          echo "Artifact validation passed successfully."

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: false
          print-hash: true

name: Fast CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality & Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.33"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Verify lockfile
        run: uv lock --check

      - name: Audit locked dependencies for known vulnerabilities
        if: matrix.python-version == '3.12'
        run: uv audit --locked --preview-features audit-command

      - name: Sync development environment for Python ${{ matrix.python-version }}
        run: uv sync --python "${{ matrix.python-version }}" --locked --group dev --extra server

      - name: Verify active Python interpreter matches matrix
        run: |
          uv run --no-sync python -c "import sys; actual = f'{sys.version_info.major}.{sys.version_info.minor}'; expected = '${{ matrix.python-version }}'; print(f'Active Python: {sys.version} (expected {expected})'); assert actual == expected, f'Expected Python {expected}, got {actual}'"

      - name: Run Ruff linter
        run: uv run --no-sync ruff check .

      - name: Run Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Run strict mypy type check
        run: uv run --no-sync mypy src tests

      - name: Run pytest with coverage
        run: uv run --no-sync pytest -q --cov=kaiwen_gateway --cov-report=term-missing

  package-smoke:
    name: Package Build & Clean Wheel Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.33"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build wheel and sdist distributions
        run: uv build

      - name: Inspect wheel and sdist contents and metadata
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          dist_dir = pathlib.Path("dist")
          wheels = list(dist_dir.glob("*.whl"))
          sdists = list(dist_dir.glob("*.tar.gz"))
          assert len(wheels) == 1, f"Expected 1 wheel, found: {wheels}"
          assert len(sdists) == 1, f"Expected 1 sdist, found: {sdists}"

          with zipfile.ZipFile(wheels[0]) as zf:
              wheel_names = zf.namelist()
              print("Wheel entries:", wheel_names)
              assert "kaiwen_gateway/__init__.py" in wheel_names
              assert "kaiwen_gateway/py.typed" in wheel_names
              assert "kaiwen_gateway/core/__init__.py" in wheel_names
              assert "kaiwen_gateway/core/admission.py" in wheel_names
              assert "kaiwen_gateway/core/composition.py" in wheel_names
              assert "kaiwen_gateway/core/config.py" in wheel_names
              assert "kaiwen_gateway/core/contracts.py" in wheel_names
              assert "kaiwen_gateway/core/exceptions.py" in wheel_names
              assert "kaiwen_gateway/core/identity.py" in wheel_names
              assert "kaiwen_gateway/core/lifecycle.py" in wheel_names
              assert "kaiwen_gateway/core/draining.py" in wheel_names
              assert "kaiwen_gateway/core/registry.py" in wheel_names
              assert "kaiwen_gateway/server/__init__.py" in wheel_names
              assert "kaiwen_gateway/server/app.py" in wheel_names
              assert "kaiwen_gateway/server/exceptions.py" in wheel_names
              assert "kaiwen_gateway/server/lifespan.py" in wheel_names
              assert "kaiwen_gateway/server/__main__.py" in wheel_names
              assert not any(name.startswith("tests/") for name in wheel_names), "tests/ leaked into wheel"
              meta_files = [name for name in wheel_names if name.endswith(".dist-info/METADATA")]
              assert len(meta_files) == 1
              metadata_text = zf.read(meta_files[0]).decode("utf-8")
              assert "Provides-Extra: server" in metadata_text
              req_lines = [line for line in metadata_text.splitlines() if line.startswith("Requires-Dist:")]
              mandatory = [line for line in req_lines if "extra ==" not in line]
              assert mandatory == [], f"Unexpected mandatory runtime dependencies in wheel: {mandatory}"
              optional = [line for line in req_lines if "extra ==" in line]
              assert len(optional) == 3, f"Expected 3 optional dependencies, got: {optional}"
              for line in optional:
                  assert 'extra ==' in line and 'server' in line

          with tarfile.open(sdists[0], "r:gz") as tf:
              sdist_names = tf.getnames()
              print("sdist entries:", sdist_names)
              assert any(name.endswith("/src/kaiwen_gateway/__init__.py") for name in sdist_names)
              assert any(name.endswith("/src/kaiwen_gateway/py.typed") for name in sdist_names)
              assert any(name.endswith("/tests/test_package.py") for name in sdist_names)
              assert any(name.endswith("/src/kaiwen_gateway/core/__init__.py") for name in sdist_names)
              assert any(name.endswith("/src/kaiwen_gateway/core/admission.py") for name in sdist_names)
              assert any(name.endswith("/src/kaiwen_gateway/core/composition.py") for name in sdist_names)
              assert any(name.endswith("/src/kaiwen_gateway/core/config.py") for name in sdist_names)
              assert any(name.endswith("/src/kaiwen_gateway/core/contracts.py") for name in sdist_names)
              assert any(name.endswith("/src/kaiwen_gateway/core/exceptions.py") for name in sdist_names)
              assert any(name.endswith("/src/kaiwen_gateway/core/identity.py") for name in sdist_names)
              assert any(name.endswith("/src/kaiwen_gateway/core/lifecycle.py") for name in sdist_names)
              assert any(name.endswith("/src/kaiwen_gateway/core/registry.py") for name in sdist_names)
              assert any(name.endswith("/tests/test_core_registry.py") for name in sdist_names)
              assert any(name.endswith("/tests/test_core_composition.py") for name in sdist_names)
              assert any(name.endswith("/tests/test_core_identity.py") for name in sdist_names)
              assert any(name.endswith("/tests/test_core_admission.py") for name in sdist_names)
              assert any(name.endswith("/tests/test_core_lifecycle.py") for name in sdist_names)
              assert any(name.endswith("/src/kaiwen_gateway/core/draining.py") for name in sdist_names)
              assert any(name.endswith("/tests/test_core_draining.py") for name in sdist_names)
              assert any(name.endswith("/src/kaiwen_gateway/server/__init__.py") for name in sdist_names)
              assert any(name.endswith("/src/kaiwen_gateway/server/app.py") for name in sdist_names)
              assert any(name.endswith("/src/kaiwen_gateway/server/exceptions.py") for name in sdist_names)
              assert any(name.endswith("/src/kaiwen_gateway/server/lifespan.py") for name in sdist_names)
              assert any(name.endswith("/src/kaiwen_gateway/server/__main__.py") for name in sdist_names)
              assert any(name.endswith("/tests/test_server_asgi.py") for name in sdist_names)
          PY

      - name: Install wheel into isolated virtualenv and verify side-effect-free import outside repo
        run: |
          WHEEL_PATH="$(pwd)/dist/kaiwen_gateway-0.1.0a1-py3-none-any.whl"
          SMOKE_DIR="$(mktemp -d)"
          cd "${SMOKE_DIR}"
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python "${WHEEL_PATH}"
          .venv/bin/python - <<'PY'
          import importlib.metadata
          import os
          import pathlib
          import socket
          import sys
          import threading
          import typing

          def _deny_network(*args: object, **kwargs: object) -> None:
              raise AssertionError(f"Unexpected network call during import: {args!r} {kwargs!r}")

          socket.socket.connect = _deny_network
          socket.socket.connect_ex = _deny_network
          socket.socket.bind = _deny_network
          socket.create_connection = _deny_network
          socket.getaddrinfo = _deny_network

          _ = typing.Final
          cwd_before = set(os.listdir("."))
          threads_before = threading.active_count()
          modules_before = set(sys.modules.keys())

          import kaiwen_gateway

          cwd_after = set(os.listdir("."))
          threads_after = threading.active_count()
          new_modules = sorted(set(sys.modules.keys()) - modules_before)

          assert kaiwen_gateway.__file__ is not None
          installed_path = pathlib.Path(kaiwen_gateway.__file__).resolve()
          print("Imported from:", installed_path)
          assert "site-packages" in installed_path.parts
          assert (installed_path.parent / "py.typed").is_file()
          assert kaiwen_gateway.__version__ == "0.1.0a1"
          assert importlib.metadata.version("kaiwen-gateway") == "0.1.0a1"
          reqs = importlib.metadata.requires("kaiwen-gateway")
          mandatory_reqs = [r for r in (reqs or []) if "extra ==" not in r]
          assert mandatory_reqs == [], f"Unexpected mandatory dependencies: {mandatory_reqs}"
          from kaiwen_gateway.server import ServerDependencyError, create_gateway_app
          try:
              create_gateway_app()
          except ServerDependencyError:
              pass
          else:
              raise AssertionError("Expected ServerDependencyError when starlette is missing")
          assert cwd_before == cwd_after
          assert threads_before == threads_after == 1
          assert new_modules == ["kaiwen_gateway"]

          import asyncio
          from kaiwen_gateway.core import (
              CORE_CONTRACT_VERSION,
              AdmissionCapacityExceededError,
              AdmissionController,
              AdmissionError,
              AdmissionLease,
              AdmissionSnapshot,
              ConnectionLifecycleError,
              ConnectionOutcome,
              ConnectionState,
              ConnectionSupervisor,
              CoreConfig,
              DrainError,
              DrainPolicy,
              DrainReport,
              InstanceDrainCoordinator,
              InstanceDrainState,
              InstanceDrainingError,
              InvalidDrainTransitionError,
              CoreConfigurationError,
              DuplicateConnectionAdmissionError,
              GlobalCapacityExceededError,
              IdentityAuthorizationError,
              InvalidConnectionTransitionError,
              InvalidIdentityError,
              InvalidLeaseError,
              LifecyclePolicy,
              LifecycleTimeoutError,
              ModuleDescriptor,
              ModuleRegistry,
              ProviderPrincipal,
              TenantCallBinding,
              TenantCapacityExceededError,
              TerminalReason,
              UntrustedConnectionClaims,
              VerifiedConnectionContext,
              bind_verified_connection_context,
              compose_gateway_core,
          )

          class SmokeVoiceModule:
              @property
              def descriptor(self) -> ModuleDescriptor:
                  return ModuleDescriptor(module_id="voice", description="Smoke test voice module")

              async def startup(self) -> None:
                  pass

              async def shutdown(self) -> None:
                  pass

          registry = ModuleRegistry()
          smoke_module = SmokeVoiceModule()
          assert registry.register(smoke_module) is smoke_module
          assert registry.get("voice") is smoke_module
          assert registry.module_ids() == ("voice",)
          assert CORE_CONTRACT_VERSION == "1.0"

          core_a = compose_gateway_core(
              CoreConfig(instance_name="smoke_a"),
              modules=[SmokeVoiceModule()],
          )
          core_b = compose_gateway_core(
              CoreConfig(instance_name="smoke_b"),
              modules=[SmokeVoiceModule()],
          )
          assert core_a.instance_id != core_b.instance_id
          assert core_a.get_module("voice") is not core_b.get_module("voice")

          try:
              CoreConfig(ingress_mode="public")
          except CoreConfigurationError:
              pass
          else:
              raise AssertionError("Expected CoreConfigurationError for ingress_mode='public'")

          principal = ProviderPrincipal("synthetic_provider")
          binding = TenantCallBinding(
              authorized_provider_id="synthetic_provider",
              tenant_id="tenant_alpha",
              call_id="call_alpha_01",
              allowed_scopes=["voice.stream"],
          )
          ctx = bind_verified_connection_context(
              principal=principal,
              binding=binding,
              connection_id="conn_01",
          )
          assert isinstance(ctx, VerifiedConnectionContext)
          assert ctx.has_scope("voice.stream") is True
          ctx.require_scope("voice.stream")
          ctx.require_tenant_and_call(tenant_id="tenant_alpha", call_id="call_alpha_01")

          try:
              ctx.require_tenant_and_call(tenant_id="tenant_bravo", call_id="call_alpha_01")
          except IdentityAuthorizationError:
              pass
          else:
              raise AssertionError("Expected IdentityAuthorizationError for wrong tenant")

          try:
              ctx.require_scope("voice.admin")
          except IdentityAuthorizationError:
              pass
          else:
              raise AssertionError("Expected IdentityAuthorizationError for ungranted scope")

          try:
              bind_verified_connection_context(
                  principal=UntrustedConnectionClaims(claimed_provider_id="synthetic_provider"),  # type: ignore[arg-type]
                  binding=binding,
                  connection_id="conn_02",
              )
          except InvalidIdentityError:
              pass
          else:
              raise AssertionError("Expected InvalidIdentityError when passing UntrustedConnectionClaims as principal")

          # M2.3 Admission Controller Smoke Verification
          async def _run_admission_smoke() -> None:
              controller = AdmissionController(max_concurrent_connections=2, max_connections_per_tenant=1)
              ctx_a1 = bind_verified_connection_context(
                  principal=principal,
                  binding=binding,
                  connection_id="conn_smoke_a1",
              )
              # 2. Acquire first lease
              lease_a1 = await controller.acquire(ctx_a1)
              assert isinstance(lease_a1, AdmissionLease)
              assert lease_a1.is_active is True

              # 4. Tenant capacity limit rejection
              ctx_a2 = bind_verified_connection_context(
                  principal=principal,
                  binding=binding,
                  connection_id="conn_smoke_a2",
              )
              try:
                  await controller.acquire(ctx_a2)
              except TenantCapacityExceededError:
                  pass
              else:
                  raise AssertionError("Expected TenantCapacityExceededError")

              # 5. Duplicate connection rejection
              try:
                  await controller.acquire(ctx_a1)
              except DuplicateConnectionAdmissionError:
                  pass
              else:
                  raise AssertionError("Expected DuplicateConnectionAdmissionError")

              # Tenant B context
              binding_b = TenantCallBinding(
                  authorized_provider_id="synthetic_provider",
                  tenant_id="tenant_bravo",
                  call_id="call_bravo_01",
                  allowed_scopes=["voice.stream"],
              )
              ctx_b1 = bind_verified_connection_context(
                  principal=principal,
                  binding=binding_b,
                  connection_id="conn_smoke_b1",
              )
              lease_b1 = await controller.acquire(ctx_b1)
              assert lease_b1.is_active is True

              # 3. Global capacity limit rejection (2/2 active)
              ctx_c1 = bind_verified_connection_context(
                  principal=principal,
                  binding=TenantCallBinding(
                      authorized_provider_id="synthetic_provider",
                      tenant_id="tenant_charlie",
                      call_id="call_charlie_01",
                      allowed_scopes=["voice.stream"],
                  ),
                  connection_id="conn_smoke_c1",
              )
              try:
                  await controller.acquire(ctx_c1)
              except GlobalCapacityExceededError:
                  pass
              else:
                  raise AssertionError("Expected GlobalCapacityExceededError")

              # 6. Successful lease release
              assert await lease_a1.release() is True
              assert lease_a1.is_active is False
              assert controller.active_connections_for_tenant("tenant_alpha") == 0

              # 7. Double release idempotence (counter unchanged)
              assert await lease_a1.release() is False

              # Release remaining
              assert await lease_b1.release() is True

              # 8. Final snapshot active_connections == 0
              snap = controller.snapshot()
              assert isinstance(snap, AdmissionSnapshot)
              assert snap.active_connections == 0
              assert snap.active_tenants == 0
              assert snap.available_capacity == 2

          asyncio.run(_run_admission_smoke())

          # M2.4A Supervised Lifecycle Smoke Verification
          async def _run_lifecycle_smoke() -> None:
              controller = AdmissionController(max_concurrent_connections=5, max_connections_per_tenant=2)
              ctx_life = bind_verified_connection_context(
                  principal=principal,
                  binding=binding,
                  connection_id="conn_smoke_life_01",
              )
              supervisor = ConnectionSupervisor(context=ctx_life, controller=controller)
              assert supervisor.state == ConnectionState.NEW

              admitted = await supervisor.admit()
              assert admitted is True
              assert supervisor.state == ConnectionState.ADMITTED
              assert controller.snapshot().active_connections == 1

              worker_ran = False

              async def smoke_worker() -> None:
                  nonlocal worker_ran
                  worker_ran = True
                  await asyncio.sleep(0.01)

              await supervisor.start(smoke_worker)
              assert supervisor.state == ConnectionState.ACTIVE

              outcome = await supervisor.wait_closed()
              assert outcome.state == ConnectionState.CLOSED
              assert outcome.reason == TerminalReason.NORMAL
              assert worker_ran is True
              assert controller.snapshot().active_connections == 0

              # Failure scenario
              ctx_fail = bind_verified_connection_context(
                  principal=principal,
                  binding=binding,
                  connection_id="conn_smoke_life_02",
              )
              supervisor_fail = ConnectionSupervisor(context=ctx_fail, controller=controller)
              await supervisor_fail.admit()

              async def failing_worker() -> None:
                  await asyncio.sleep(0.01)
                  raise ValueError("Synthetic worker failure")

              await supervisor_fail.start(failing_worker)
              fail_outcome = await supervisor_fail.wait_closed()
              assert fail_outcome.state == ConnectionState.FAILED
              assert fail_outcome.reason == TerminalReason.WORKER_FAILED
              assert controller.snapshot().active_connections == 0

          asyncio.run(_run_lifecycle_smoke())

          # M2.4B Instance Draining Smoke Verification
          async def _run_draining_smoke() -> None:
              drain_ctrl = AdmissionController(max_concurrent_connections=2, max_connections_per_tenant=2)
              coord = InstanceDrainCoordinator(
                  controller=drain_ctrl,
                  policy=DrainPolicy(grace_period=0.1, force_close_timeout=0.1),
              )
              assert coord.state == InstanceDrainState.ACCEPTING
              assert coord.is_accepting is True

              ctx_drain = bind_verified_connection_context(
                  principal=principal,
                  binding=binding,
                  connection_id="conn_smoke_drain_01",
              )
              sup_drain = await coord.admit_connection(ctx_drain)
              assert sup_drain.state == ConnectionState.ADMITTED
              assert coord.active_connections_count == 1
              assert drain_ctrl.snapshot().active_connections == 1

              drain_worker_done = False

              async def drain_worker() -> None:
                  nonlocal drain_worker_done
                  drain_worker_done = True
                  await asyncio.sleep(0.01)

              await sup_drain.start(drain_worker)

              report = await coord.drain()
              assert isinstance(report, DrainReport)
              assert report.final_state == InstanceDrainState.STOPPED
              assert report.initial_connections == 1
              assert report.graceful_completions == 1
              assert report.force_closed == 0
              assert report.unresolved_connections == 0
              assert report.active_leases_remaining == 0
              assert drain_ctrl.snapshot().active_connections == 0
              assert drain_worker_done is True

              # Rejection of new admission in STOPPED state
              try:
                  await coord.admit_connection(
                      bind_verified_connection_context(
                          principal=principal,
                          binding=binding,
                          connection_id="conn_smoke_drain_02",
                      )
                  )
              except InstanceDrainingError:
                  pass
              else:
                  raise AssertionError("Expected InstanceDrainingError in STOPPED state")

          asyncio.run(_run_draining_smoke())

          assert cwd_before == set(os.listdir("."))
          assert threads_before == threading.active_count() == 1
          print("Clean wheel smoke test passed (M1 + M2.1 + M2.2A + M2.2B + M2.3 + M2.4A + M2.4B).")
          PY

      - name: Install wheel with [server] extra into isolated virtualenv and verify ASGI runtime smoke outside repo
        run: |
          WHEEL_PATH="$(pwd)/dist/kaiwen_gateway-0.1.0a1-py3-none-any.whl"
          SMOKE_DIR="$(mktemp -d)"
          cd "${SMOKE_DIR}"
          uv venv --python 3.12 .venv_server
          uv pip install --python .venv_server/bin/python "${WHEEL_PATH}[server]"
          .venv_server/bin/python - <<'PY'
          import asyncio
          import sys

          # 1. Verify dev tools are NOT installed
          for dev_pkg in ["pytest", "ruff", "mypy"]:
              try:
                  __import__(dev_pkg)
              except ImportError:
                  pass
              else:
                  raise AssertionError(f"Dev tool {dev_pkg} leaked into server extra environment")

          # 2. Verify server dependencies are installed
          import starlette
          import uvicorn
          print(f"Starlette version: {starlette.__version__}, Uvicorn version: {uvicorn.__version__}")

          # 3. Verify server app factory and lifespan
          from kaiwen_gateway.server import (
              create_gateway_app,
              default_app,
              gateway_lifespan,
          )

          app = create_gateway_app()
          assert app is not None
          assert callable(default_app)

          async def _run_server_smoke() -> None:
              async with gateway_lifespan(app):
                  # Test /health endpoint via direct ASGI call
                  health_status = None
                  health_body = []
                  async def h_recv():
                      return {"type": "http.request", "body": b""}
                  async def h_send(msg):
                      nonlocal health_status
                      if msg["type"] == "http.response.start":
                          health_status = msg["status"]
                      elif msg["type"] == "http.response.body":
                          health_body.append(msg.get("body", b""))

                  await app({
                      "type": "http",
                      "method": "GET",
                      "path": "/health",
                      "headers": [],
                      "query_string": b"",
                  }, h_recv, h_send)
                  assert health_status == 200

                  # Test /ready endpoint (default ingress_mode=disabled -> 503)
                  ready_status = None
                  async def r_recv():
                      return {"type": "http.request", "body": b""}
                  async def r_send(msg):
                      nonlocal ready_status
                      if msg["type"] == "http.response.start":
                          ready_status = msg["status"]

                  await app({
                      "type": "http",
                      "method": "GET",
                      "path": "/ready",
                      "headers": [],
                      "query_string": b"",
                  }, r_recv, r_send)
                  assert ready_status == 503

                  # Test websocket rejection (1008)
                  ws_code = None
                  async def ws_recv():
                      return {"type": "websocket.connect"}
                  async def ws_send(msg):
                      nonlocal ws_code
                      if msg["type"] == "websocket.close":
                          ws_code = msg["code"]

                  await app({
                      "type": "websocket",
                      "path": "/ws",
                      "headers": [],
                  }, ws_recv, ws_send)
                  assert ws_code == 1008

          asyncio.run(_run_server_smoke())
          assert getattr(app.state, "stopped", False) is True
          print("Server extra ASGI smoke test passed (M3.1).")

          # 4. Verify real WebSockets package and synthetic transport loopback
          import json
          import websockets
          from kaiwen_gateway.core import CoreConfig
          from kaiwen_gateway.transports.synthetic import SyntheticAuthBridge, SyntheticTokenVerifier

          async def _run_synthetic_ws_smoke() -> None:
              secret = "smoke_secret_key_at_least_16_bytes!"
              verifier = SyntheticTokenVerifier(secret)
              bridge = SyntheticAuthBridge(verifier=verifier)
              app_syn = create_gateway_app(
                  config=CoreConfig(ingress_mode="synthetic"),
                  synthetic_auth_bridge=bridge,
              )

              uv_config = uvicorn.Config(
                  app_syn,
                  host="127.0.0.1",
                  port=0,
                  log_level="error",
                  ws="websockets",
                  ws_max_size=65536,
              )
              server = uvicorn.Server(uv_config)
              serve_task = asyncio.create_task(server.serve())

              try:
                  while not server.started:
                      await asyncio.sleep(0.02)

                  assert server.servers is not None and len(server.servers) > 0
                  sockets = server.servers[0].sockets
                  port = sockets[0].getsockname()[1]
                  ws_url = f"ws://127.0.0.1:{port}/ws/synthetic/v1"

                  # A. Valid token -> Handshake -> session.ready -> ping -> pong -> end
                  valid_token = verifier.issue_token(
                      provider_id="smoke_provider",
                      tenant_id="tenant_smoke",
                      call_id="call_smoke_01",
                      allowed_scopes=["voice.stream"],
                  )
                  hdrs = {"Authorization": f"Bearer {valid_token}"}
                  async with websockets.connect(ws_url, additional_headers=hdrs) as ws:
                      ready_raw = await ws.recv()
                      ready = json.loads(ready_raw)
                      assert ready["event"] == "session.ready"
                      assert ready["call_id"] == "call_smoke_01"

                      await ws.send(json.dumps({"event": "session.ping", "seq": 42}))
                      pong_raw = await ws.recv()
                      pong = json.loads(pong_raw)
                      assert pong["event"] == "session.pong"
                      assert pong["seq"] == 42

                      await ws.send(json.dumps({"event": "session.end"}))
                      try:
                          await ws.recv()
                      except websockets.exceptions.ConnectionClosed as close_exc:
                          assert close_exc.rcvd.code == 1000

                  # B. Forged token -> Pre-accept rejection (HTTP 403)
                  forged_hdrs = {"Authorization": "Bearer forged_invalid_token"}
                  try:
                      async with websockets.connect(ws_url, additional_headers=forged_hdrs):
                          raise AssertionError("Expected handshake rejection for forged token")
                  except websockets.exceptions.InvalidStatus as err:
                      assert err.response.status_code == 403

                  # C. Verify zero active leases remaining
                  assert app_syn.state.drain_coordinator.active_connections_count == 0
                  assert app_syn.state.admission_controller.snapshot().active_connections == 0
              finally:
                  server.should_exit = True
                  await serve_task

          asyncio.run(_run_synthetic_ws_smoke())
          print("Server extra real WebSockets loopback smoke test passed (M3.2A).")
          PY

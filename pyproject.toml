[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "kaiwen-gateway"
version = "0.1.0a1"
description = "Modular, provider-agnostic communication gateway for real-time AI applications."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kaiwen" },
]
keywords = [
    "ai",
    "gateway",
    "realtime",
    "telephony",
    "voice",
    "websocket",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Telephony",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
server = [
    "starlette>=0.40,<2",
    "uvicorn>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/ImtheKaiwen/kaiwen-gateway"
Repository = "https://github.com/ImtheKaiwen/kaiwen-gateway.git"
Documentation = "https://github.com/ImtheKaiwen/kaiwen-gateway/tree/main/docs"
Issues = "https://github.com/ImtheKaiwen/kaiwen-gateway/issues"
Changelog = "https://github.com/ImtheKaiwen/kaiwen-gateway/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "websockets>=13.0,<16",
    "mypy>=1.11,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=5.0,<8",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kaiwen_gateway"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/kaiwen_gateway",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["*.py", "*.pyi", "pyproject.toml"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
]

[tool.coverage.run]
branch = true
source = ["kaiwen_gateway"]

[tool.coverage.report]
show_missing = true
skip_empty = false
